name: Validate

# The fast tier of scripts/validate.sh: project generation and the static
# checks, the package tests, the app-hosted unit tests, the unsigned build, and
# the localization verify. About seven minutes on a runner. Everything that
# needs simulator UI automation - the iPhone regressions and iPad/Mac
# suites - lives in the `Release Gate` workflow, which
# runs the full tier on demand and on release tags rather than per pull request.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "data/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate App And Tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned: validate.sh asserts this exact version, because different
      # XcodeGen releases serialize the committed pbxproj differently.
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          cd /tmp/xcodegen-dist/xcodegen && sudo ./install.sh

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
          xcrun simctl list devices available

      - name: Run the fast validation tier
        run: |
          MILEAGE_DERIVED_DATA="$PWD/build/DerivedData" \
          MILEAGE_RESULT_BUNDLE="$PWD/build/MileageTrackerValidation.xcresult" \
          scripts/validate.sh --fast

      - name: Upload result bundles on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-result-bundles
          path: |
            build/*.xcresult
          if-no-files-found: ignore
